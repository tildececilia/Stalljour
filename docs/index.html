<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiWorks</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="%2314453a" stroke-width="6"/><path fill="%2314453a" d="M21 51 C19 45 17 40 17 33 C17 26 18 22 21 18 L24 12 L27 17 L30 12 L33 17 C38 19 42 24 44 29 C45 32 45 34 43 35 L39 36 C38 40 37 44 35 47 C33 50 28 52 21 51 Z"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=33">
<script>try{if(localStorage.getItem("stalljour.theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body>
<header class="app">
  <div class="logo"><svg class="logomark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="5"/>
    <line x1="50" y1="19" x2="46.5" y2="21.8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="32" x2="50.5" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="45" x2="46.5" y2="42.2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path fill="currentColor" d="M20 51 C18.5 45 17 40 17 33.5 C17 27 18.5 22.5 21.5 18.5 L24.5 12.5 L27.2 17 L30.2 12.5 L33 17.2 C38 19.5 41.8 24 43.6 29 C44.6 31.8 44.4 33.6 42.6 34.4 L38.8 35.6 C38 39.8 36.8 43.6 34.8 46.6 C32.6 49.8 27.5 51.8 20 51 Z"/>
  </svg>EquiWorks</div>
  <div class="spacer"></div>
  <div class="menuwrap">
    <button class="btn sm" id="btnSchedule" style="display:none"><span class="islot" data-icon="calendar"></span><span class="lbl"> Schema</span></button>
    <div class="menu" id="scheduleMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnMine" style="display:none"><span class="islot" data-icon="list"></span><span class="lbl"> Mina pass</span></button>
    <div class="menu" id="mineMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnChat" style="display:none"><span class="islot" data-icon="message"></span><span class="lbl"> Chatt</span></button>
    <div class="menu" id="chatMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnSettings" style="display:none"><span class="islot" data-icon="settings"></span><span class="lbl"> Inställningar</span></button>
    <div class="menu" id="settingsMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnProfile" style="display:none"><span class="islot" data-icon="user"></span><span class="lbl"> Profil</span></button>
    <div class="menu" id="profileMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn ghost sm bellbtn" id="btnBell" style="display:none" title="Notiser"><span class="islot" data-icon="bell"></span><span class="badge" id="bellBadge" style="display:none"></span></button>
    <div class="menu bellmenu" id="bellMenu"></div>
  </div>
  <button class="btn ghost sm" id="btnTheme" title="Byt mellan ljust och mörkt läge"></button>
  <div class="menuwrap mobonly">
    <button class="btn sm" id="btnBurger" style="display:none" title="Meny"><span class="islot" data-icon="menu"></span></button>
    <div class="menu" id="burgerMenu"></div>
  </div>
</header>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=33"></script>
<script src="app.js?v=33"></script>
</body>
</html>
